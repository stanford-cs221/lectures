<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="600" height="270" font-family="Helvetica, Arial, sans-serif" font-size="14">
<rect width="600" height="270" fill="white"/>
<!-- Agent: the (stochastic) policy, updated using estimated values as a baseline -->
<rect x="20" y="25" width="220" height="225" rx="12" fill="#f4f4f4" stroke="#555" stroke-width="2"/>
<rect x="40" y="45" width="180" height="50" rx="8" fill="white" stroke="#2a9d8f" stroke-width="2.5"/>
<text x="104" y="78" text-anchor="end" fill="#222" font-size="18">policy</text>
<text x="110" y="79" fill="#222" font-family="Times New Roman, Times, serif" font-style="italic" font-size="26">π</text>
<text x="124" y="85" fill="#222" font-family="Times New Roman, Times, serif" font-style="italic" font-size="17">θ</text>
<text x="135" y="79" fill="#222" font-family="Times New Roman, Times, serif" font-style="italic" font-size="24"><tspan font-style="normal">(</tspan>a<tspan font-style="normal"> | </tspan>s<tspan font-style="normal">)</tspan></text>
<rect x="40" y="145" width="180" height="50" rx="8" fill="white" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="112" y="178" text-anchor="end" fill="#222" font-size="18">values</text>
<text x="120" y="179" fill="#222" font-family="Times New Roman, Times, serif" font-style="italic" font-size="24">V</text>
<path d="M125,159 L131.5,154 L138,159" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="137" y="179" fill="#222" font-family="Times New Roman, Times, serif" font-style="italic" font-size="24"><tspan font-style="normal">(</tspan>s<tspan font-style="normal">)</tspan></text>
<line x1="130" y1="143" x2="130" y2="108" stroke="#555" stroke-width="2"/>
<path d="M130,97 L124,108 L136,108 Z" fill="#555"/>
<text x="142" y="126" fill="#555" font-size="13" font-style="italic">baseline</text>
<text x="130" y="232" text-anchor="middle" fill="#222" font-size="20">Agent</text>
<!-- Action: agent -> environment -->
<line x1="240" y1="80" x2="408" y2="80" stroke="#2a9d8f" stroke-width="3"/>
<path d="M420,80 L408,86 L408,74 Z" fill="#2a9d8f"/>
<text x="330" y="66" text-anchor="middle" fill="#2a9d8f" font-size="17" font-weight="bold">action</text>
<!-- Reward, observation: environment -> agent -->
<line x1="420" y1="170" x2="252" y2="170" stroke="#9b72cf" stroke-width="3"/>
<path d="M240,170 L252,164 L252,176 Z" fill="#9b72cf"/>
<text x="330" y="198" text-anchor="middle" fill="#9b72cf" font-size="17" font-weight="bold">reward, observation</text>
<!-- Environment: box with a globe -->
<rect x="420" y="25" width="160" height="225" rx="12" fill="#f4f4f4" stroke="#555" stroke-width="2"/>
<circle cx="500" cy="125" r="22" fill="white" stroke="#2a9d8f" stroke-width="2.5"/>
<ellipse cx="500" cy="125" rx="9" ry="22" fill="none" stroke="#2a9d8f" stroke-width="2"/>
<line x1="478" y1="125" x2="522" y2="125" stroke="#2a9d8f" stroke-width="2"/>
<path d="M482,113 Q500,119 518,113 M482,137 Q500,131 518,137" fill="none" stroke="#2a9d8f" stroke-width="1.5"/>
<text x="500" y="232" text-anchor="middle" fill="#222" font-size="20">Environment</text>
</svg>
