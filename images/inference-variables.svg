<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 132" width="470" height="132" font-family="Helvetica, Arial, sans-serif" font-size="14">
<rect width="470" height="132" fill="white"/>
<!-- Groups: evidence (T, A), query (R), marginalized (S) -->
<rect x="10" y="30" width="210" height="70" rx="10" fill="#e6eff5" stroke="#457b9d" stroke-width="2"/>
<rect x="240" y="30" width="100" height="70" rx="10" fill="#fff1e0" stroke="#f77f00" stroke-width="2"/>
<rect x="360" y="30" width="100" height="70" rx="10" fill="#f2f2f2" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/>
<!-- Variables -->
<circle cx="45" cy="65" r="22" fill="#ccc" stroke="#457b9d" stroke-width="2"/>
<text x="45" y="72" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="22" fill="#222">T</text>
<text x="73" y="72" font-family="Times New Roman, serif" font-size="20" fill="#222">= 1</text>
<circle cx="145" cy="65" r="22" fill="#ccc" stroke="#457b9d" stroke-width="2"/>
<text x="145" y="72" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="22" fill="#222">A</text>
<text x="173" y="72" font-family="Times New Roman, serif" font-size="20" fill="#222">= 1</text>
<circle cx="290" cy="65" r="22" fill="white" stroke="#f77f00" stroke-width="2"/>
<text x="290" y="72" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="22" fill="#222">R</text>
<circle cx="410" cy="65" r="22" fill="white" stroke="#999" stroke-width="2"/>
<text x="410" y="72" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="22" fill="#777">S</text>
<!-- Labels -->
<text x="115" y="20" text-anchor="middle" fill="#457b9d" font-weight="bold">evidence</text>
<text x="290" y="20" text-anchor="middle" fill="#f77f00" font-weight="bold">query</text>
<text x="410" y="20" text-anchor="middle" fill="#777" font-weight="bold">marginalized</text>
<text x="115" y="122" text-anchor="middle" fill="#555">what we observe</text>
<text x="290" y="122" text-anchor="middle" fill="#555">what we want</text>
<text x="410" y="122" text-anchor="middle" fill="#777">summed out</text>
</svg>
