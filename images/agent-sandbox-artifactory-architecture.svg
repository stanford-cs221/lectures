<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="400" fill="#ffffff"/>

  <!-- Three agent sandboxes (left column) -->
  <rect x="30" y="20"  width="200" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="66" text-anchor="middle" font-size="16" font-weight="600" fill="#1e3a8a">Agent Sandbox A</text>

  <rect x="30" y="160" width="200" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="206" text-anchor="middle" font-size="16" font-weight="600" fill="#1e3a8a">Agent Sandbox B</text>

  <rect x="30" y="300" width="200" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="346" text-anchor="middle" font-size="16" font-weight="600" fill="#1e3a8a">Agent Sandbox C</text>

  <!-- Arrows from sandboxes to Artifactory (middle) -->
  <line x1="230" y1="60"  x2="380" y2="190" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="230" y1="200" x2="380" y2="200" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="230" y1="340" x2="380" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Artifactory (middle) -->
  <rect x="380" y="160" width="200" height="80" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="480" y="210" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Artifactory</text>

  <!-- Arrow from Artifactory to the Internet (right) -->
  <line x1="580" y1="200" x2="638" y2="200" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Internet cloud (right) -->
  <path transform="translate(650,144) scale(0.22)"
        d="M537.6 226.6c4.1-10.7 6.4-22.4 6.4-34.6 0-53-43-96-96-96-19.7 0-38.1 6-53.3 16.2C367 64.2 315.3 32 256 32c-88.4 0-160 71.6-160 160 0 2.7.1 5.4.2 8.1C40.2 219.8 0 273.2 0 336c0 79.5 64.5 144 144 144h368c70.7 0 128-57.3 128-128 0-61.9-44-113.6-102.4-125.4z"
        fill="#f3f4f6" stroke="#374151" stroke-width="9"/>
  <text x="720" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Internet</text>
</svg>
