<svg xmlns='http://www.w3.org/2000/svg' width='1780' height='860' viewBox='0 0 1780 860'><defs><marker id='arrow' markerWidth='20' markerHeight='15' refX='19' refY='7.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L20,7.5 L0,15 z' fill='context-stroke'/></marker></defs><rect width='1780' height='860' fill='white'/><rect x='26' y='50' width='1733' height='790' rx='0' fill='white' stroke='#000' stroke-width='3'/><rect x='145' y='20' width='850' height='62' fill='white'/><text x='155' y='68' text-anchor='start' font-size='52' font-family="Helvetica, Arial, sans-serif" font-weight='bold' font-style='normal' fill='#ff9f00' >Example: Modus ponens inference</text><text x='57' y='165' text-anchor='start' font-size='52' font-family="Helvetica, Arial, sans-serif" font-weight='normal' font-style='normal' fill='#00008b' >Starting point:</text><text x='135' y='270' text-anchor='start' font-size='64' font-family="'STIX Two Math', 'Cambria Math', 'Latin Modern Math', 'Times New Roman', serif"><tspan fill='#000' font-style='normal'>KB = {</tspan><tspan fill='#000' font-style='normal'>Rain, Rain → Wet, Wet → Slippery</tspan><tspan fill='#000' font-style='normal'>}</tspan></text><text x='57' y='375' font-size='52' font-family="Helvetica, Arial, sans-serif" fill='#00008b'>Apply modus ponens to <tspan font-family="'STIX Two Math', 'Cambria Math', 'Latin Modern Math', 'Times New Roman', serif" fill='#000'>Rain  and  Rain → Wet</tspan>:</text><text x='135' y='480' text-anchor='start' font-size='64' font-family="'STIX Two Math', 'Cambria Math', 'Latin Modern Math', 'Times New Roman', serif"><tspan fill='#000' font-style='normal'>KB = {</tspan><tspan fill='#000' font-style='normal'>Rain, Rain → Wet, Wet → Slippery</tspan><tspan fill='#000' font-style='normal'>, </tspan><tspan fill='red' font-style='normal'>Wet</tspan><tspan fill='#000' font-style='normal'>}</tspan></text><text x='57' y='590' font-size='52' font-family="Helvetica, Arial, sans-serif" fill='#00008b'>Apply modus ponens to <tspan font-family="'STIX Two Math', 'Cambria Math', 'Latin Modern Math', 'Times New Roman', serif" fill='#000'>Wet  and  Wet → Slippery</tspan>:</text><text x='135' y='700' text-anchor='start' font-size='64' font-family="'STIX Two Math', 'Cambria Math', 'Latin Modern Math', 'Times New Roman', serif"><tspan fill='#000' font-style='normal'>KB = {</tspan><tspan fill='#000' font-style='normal'>Rain, Rain → Wet, Wet → Slippery</tspan><tspan fill='#000' font-style='normal'>, </tspan><tspan fill='red' font-style='normal'>Wet</tspan><tspan fill='#000' font-style='normal'>, </tspan><tspan fill='red' font-style='normal'>Slippery</tspan><tspan fill='#000' font-style='normal'>}</tspan></text><text x='57' y='800' text-anchor='start' font-size='52' font-family="Helvetica, Arial, sans-serif" font-weight='normal' font-style='normal' fill='#00008b' >Converged.</text></svg>